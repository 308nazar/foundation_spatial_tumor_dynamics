[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "foundation-spatial-tumor-dynamics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.5", "pyyaml>=6", "pandas>=2.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.black]
line-length = 100
[tool.mypy]
strict = true
python_version = "3.11"
